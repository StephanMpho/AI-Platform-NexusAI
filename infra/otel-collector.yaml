receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  batch: {timeout: 5s}
  # Strip prompt and completion content unless a workspace explicitly opts in.
  # Trace backends are rarely governed as carefully as the database.
  attributes/strip-content:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}

exporters:
  debug: {verbosity: normal}
  prometheus: {endpoint: 0.0.0.0:8889}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip-content, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
