name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s --health-retries 10
    env:
      NEXUS_ENV: local
      NEXUS_AUTH__DEV_BYPASS: "true"
      NEXUS_TELEMETRY__ENABLED: "false"
      NEXUS_DATABASE__URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: alembic upgrade head
      - run: pytest -q --cov=nexus --cov-report=term-missing

  console:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/console}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: apps/console/package-lock.json}
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # A secret in git history is a secret, even if a later commit removed it.
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit && pip-audit --strict || true
